packages:
  - "packages/*"

allowBuilds:
  esbuild: true

# Define a catalog of version ranges.
catalogs:
  default:
    "@types/vscode": 1.107.0
    "@types/node": 22.18.0
    "@types/mocha": 10.0.10
    "glob": 13.0.0
    "@types/glob": 9.0.0
    "@superoffice/webapi": 11.7.727
    "esbuild": 0.25.0
    vite: npm:@voidzero-dev/vite-plus-core@latest
    vitest: npm:@voidzero-dev/vite-plus-test@latest
    vite-plus: latest
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
